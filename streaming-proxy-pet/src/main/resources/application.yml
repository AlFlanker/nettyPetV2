server:
  # Демонстрационный сервер доступен только с этой машины. Для внешнего доступа
  # адрес прослушивания нужно задать явно в конфигурации окружения.
  address: 127.0.0.1
  port: ${PROXY_PORT:8080}
spring:
  application:
    name: streaming-proxy-pet
  # Отключаем предварительное чтение и разбор form/multipart, чтобы сервлет
  # получил исходный поток байтов. Это настройка выделенного прокси-приложения;
  # в смешанном MVC-приложении обход разбора должен применяться только к proxy-маршрутам.
  servlet:
    multipart:
      enabled: false
  mvc:
    formcontent:
      filter:
        enabled: false
proxy:
  # Фиксированный адрес целевого сервера. Путь и query сохраняются из запроса клиента.
  backend-url: ${BACKEND_URL:http://127.0.0.1:9090}
  # При превышении лимита отвечаем 503 без постановки запроса в очередь.
  max-in-flight: ${PROXY_MAX_IN_FLIGHT:32}
  # Только обработка сетевых событий Netty; блокирующий Servlet I/O выполняется
  # отдельно на виртуальных потоках и не задерживает эти циклы обработки событий.
  io-threads: 2
  # Порция тела — 16 KiB. Это не предел памяти всего обмена: свои ограниченные
  # буферы также используют Jetty, HTTP-кодек, TLS и операционная система.
  chunk-size: 16384
  # Применяется отдельно к TCP-подключению, TLS-рукопожатию и одному DNS-запросу.
  connect-timeout: 3s
  # Ожидание следующей части ответа после отправки запроса или раннего окончательного ответа.
  # Время записи медленному клиенту сюда не входит; его ограничивает общий срок ниже.
  read-timeout: 30s
  # Срок всего обмена, включая загрузку от клиента. Для больших файлов его увеличивают.
  exchange-timeout: 60s
  # Интервал ожидания остановки задач и каналов. Занятое место в семафоре не возвращается,
  # пока задача чтения тела действительно не завершилась, даже после отмены.
  shutdown-timeout: 5s
